[project]
name = "shim"
version = "0.1.0"
description = "Small-model tool-calling agent that edits demonstration prosthetic parts and sends them to a virtual 3D printer."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
