# Slicer profile "demo_020" for PrusaSlicer's CLI. Generic 0.4 mm FDM printer, 180 mm bed.
# Unlisted settings use PrusaSlicer's defaults. Demonstration prints only.
layer_height = 0.20
first_layer_height = 0.2
nozzle_diameter = 0.4
filament_diameter = 1.75
temperature = 215
first_layer_temperature = 215
bed_temperature = 60
first_layer_bed_temperature = 60
bed_shape = 0x0,180x0,180x180,0x180
max_print_height = 180
gcode_flavor = marlin2
perimeters = 3
top_solid_layers = 4
bottom_solid_layers = 4
fill_density = 15%
support_material = 1
support_material_buildplate_only = 1
brim_width = 6
skirts = 1
